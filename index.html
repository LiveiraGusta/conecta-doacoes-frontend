<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Conecta Doações: conectando quem doa a quem precisa." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Conecta Doações</title>
    <!-- Anti-flash: aplica o tema salvo antes do React. Mesma chave de src/core/theme/theme.ts. O hash está na CSP do vercel.json. -->
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('cd-theme') || '{}'),
            c = ['AZUL', 'VERDE', 'ROXO', 'LARANJA', 'ROSA'].indexOf(t.color) >= 0 ? t.color : 'AZUL',
            m = t.mode || 'SYSTEM',
            r = document.documentElement;
          r.dataset.themeColor = c.toLowerCase();
          if (m === 'DARK' || (m === 'SYSTEM' && matchMedia('(prefers-color-scheme: dark)').matches))
            r.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
